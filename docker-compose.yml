name: relgari

services:
  db:
    image: postgres:17
    container_name: relgari-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: relgari
      POSTGRES_PASSWORD: relgari_dev
      POSTGRES_DB: relgari
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relgari -d relgari"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
